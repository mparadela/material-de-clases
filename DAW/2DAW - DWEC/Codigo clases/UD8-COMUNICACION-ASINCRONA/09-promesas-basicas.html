<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promesas Básicas</title>
    <link rel="stylesheet" href="00-styles.css">
</head>
<body>
    <h1>🤝 Promesas Básicas</h1>
    
    <div class="concepto">
        <h2>¿Qué es una Promesa?</h2>
        <p>Un objeto que representa el resultado futuro de una operación asíncrona</p>
    </div>

    <div class="estados">
        <div class="estado pending">
            <h3>⏳ PENDING</h3>
            <p>Pendiente: aún no se sabe el resultado</p>
        </div>
        <div class="estado fulfilled">
            <h3>✅ FULFILLED</h3>
            <p>Cumplida: operación exitosa</p>
        </div>
        <div class="estado rejected">
            <h3>❌ REJECTED</h3>
            <p>Rechazada: operación fallida</p>
        </div>
    </div>

    <div class="info">
        📺 Abre la consola para ver las promesas en acción
    </div>

    <script src="09-promesas-basicas.js"></script>
</body>
</html>
