<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>async/await Básico</title>
    <link rel="stylesheet" href="14--async-await-basico.css">
</head>
<body>
    <h1>📚 async/await Básico</h1>
    
    <div class="reglas">
        <h2>Reglas Importantes:</h2>
        <div class="regla">
            <strong>1.</strong> Una función <code>async</code> SIEMPRE devuelve una promesa
        </div>
        <div class="regla">
            <strong>2.</strong> Solo puedes usar <code>await</code> dentro de funciones <code>async</code>
        </div>
        <div class="regla">
            <strong>3.</strong> <code>await</code> "pausa" la función hasta que la promesa se resuelva
        </div>
    </div>

    <div class="info">
        📺 Abre la consola para ver ejemplos
    </div>

    <script src="14--async-await-basico.js"></script>
</body>
</html>
