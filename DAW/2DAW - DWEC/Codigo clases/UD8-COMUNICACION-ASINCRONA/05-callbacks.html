<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callbacks</title>
    <link rel="stylesheet" href="00-styles.css">
</head>
<body>
    <h1>🔄 Callbacks</h1>
    
    <div class="info">
        <strong>Callback:</strong> Función que se pasa como parámetro a otra función
    </div>

    <div class="ejemplos">
        <div class="ejemplo">
            <h2>Callbacks Síncronos</h2>
            <p>Se ejecutan inmediatamente (ej: .forEach(), .map())</p>
        </div>

        <div class="ejemplo">
            <h2>Callbacks Asíncronos</h2>
            <p>Se ejecutan "después" cuando termina una operación</p>
        </div>
    </div>

    <script src="05-callbacks.js"></script>
</body>
</html>
