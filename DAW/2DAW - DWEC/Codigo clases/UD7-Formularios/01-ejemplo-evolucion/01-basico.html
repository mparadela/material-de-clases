<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación Básica - Sesión 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Versión Básica (Sesión 1)</h2>
    <form>
        <label>Email:</label>
        <input type="text" id="email">
        <button type="submit">Enviar</button>
    </form>

    <script>
        const emailInput = document.getElementById('email');
        
        emailInput.addEventListener('blur', () => {
            if (emailInput.value === '') {
                console.log('El email está vacío');
            } else {
                console.log('El email tiene contenido');
            }
        });
    </script>
</body>
</html>
