<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación Profesional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .invalido {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }
        .valido {
            border-color: #27ae60;
            background-color: #eafaf1;
        }
        .mensaje-error {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            margin-bottom: 15px;
            display: none;
        }
        .mensaje-error.visible {
            display: block;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>Versión Profesional (Hoy)</h2>
    <form>
        <div>
            <label for="email">Email:</label>
            <input type="text" id="email">
            <div class="mensaje-error" id="email-error"></div>
        </div>
        <button type="submit">Enviar</button>
    </form>

    <script>
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        emailInput.addEventListener('blur', () => {
            const valor = emailInput.value.trim();
            
            if (valor === '') {
                emailInput.classList.add('invalido');
                emailInput.classList.remove('valido');
                emailError.textContent = 'El email es obligatorio';
                emailError.classList.add('visible');
            } else if (!emailRegex.test(valor)) {
                emailInput.classList.add('invalido');
                emailInput.classList.remove('valido');
                emailError.textContent = 'Introduce un email válido (ejemplo: usuario@dominio.com)';
                emailError.classList.add('visible');
            } else {
                emailInput.classList.remove('invalido');
                emailInput.classList.add('valido');
                emailError.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
