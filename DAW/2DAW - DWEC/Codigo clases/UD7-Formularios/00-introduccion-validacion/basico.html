<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación Básica - Sesión 1</title>
</head>
<body>
    <h2>Versión Básica (Sesión 1)</h2>
    <form id="formulario">
        <label>Email:</label>
        <input type="text" id="email">
        <button type="submit">Enviar</button>
    </form>

    <script>
        const emailInput = document.getElementById('email');
        
        emailInput.addEventListener('blur', () => {
            if (emailInput.value === '') {
                console.log('El email está vacío');
            } else {
                console.log('El email tiene contenido');
            }
        });
    </script>
</body>
</html>
