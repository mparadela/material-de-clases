<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Usuarios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👥 Explorador de Usuarios</h1>
        
        <div class="controles">
            <button id="btn-cargar" class="btn-primary">Cargar Usuarios</button>
        </div>

        <!-- LOADING -->
        <div id="loading" class="loading oculto">
            <div class="spinner"></div>
            <p>Cargando usuarios...</p>
        </div>

        <!-- LISTA DE USUARIOS -->
        <div id="lista-usuarios" class="lista-usuarios">
            <!-- Aquí se mostrarán los usuarios -->
        </div>

        <!-- MENSAJE DE ERROR -->
        <div id="mensaje-error" class="mensaje-error oculto">
            <h3>⚠️ Error al cargar usuarios</h3>
            <p id="texto-error"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
