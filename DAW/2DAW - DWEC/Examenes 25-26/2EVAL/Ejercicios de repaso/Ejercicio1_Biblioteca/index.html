<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Biblioteca de Libros</h1>
        
        <!-- FORMULARIO -->
        <div class="formulario-seccion">
            <h2>Añadir Nuevo Libro</h2>
            <form id="formulario-libro">
                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" placeholder="Ej: Don Quijote de la Mancha">
                    <span class="error" id="titulo-error"></span>
                </div>

                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" placeholder="Ej: Miguel de Cervantes">
                    <span class="error" id="autor-error"></span>
                </div>

                <div class="form-group">
                    <label for="anio">Año de publicación:</label>
                    <input type="number" id="anio" placeholder="Ej: 1605">
                    <span class="error" id="anio-error"></span>
                </div>

                <div class="form-group">
                    <label for="paginas">Número de páginas:</label>
                    <input type="number" id="paginas" placeholder="Ej: 863">
                    <span class="error" id="paginas-error"></span>
                </div>

                <button type="submit" class="btn-primary">Añadir Libro</button>
            </form>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="estadisticas">
            <div class="stat-card">
                <h3>Total de Libros</h3>
                <p id="total-libros" class="stat-numero">0</p>
            </div>
            <div class="stat-card">
                <h3>Total de Páginas</h3>
                <p id="total-paginas" class="stat-numero">0</p>
            </div>
        </div>

        <!-- LISTA DE LIBROS -->
        <div class="lista-seccion">
            <h2>Mi Colección</h2>
            <div id="lista-libros">
                <!-- Aquí se mostrarán los libros -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
