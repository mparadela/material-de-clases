<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concesionario de Vehículos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚗 Concesionario de Vehículos</h1>
        
        <!-- FORMULARIO -->
        <div class="formulario-seccion">
            <h2>Añadir Nuevo Vehículo</h2>
            <form id="formulario-vehiculo">
                <div class="form-group">
                    <label for="marca">Marca:</label>
                    <input type="text" id="marca" placeholder="Ej: Toyota">
                </div>

                <div class="form-group">
                    <label for="modelo">Modelo:</label>
                    <input type="text" id="modelo" placeholder="Ej: Corolla">
                </div>

                <div class="form-group">
                    <label for="anio">Año:</label>
                    <input type="number" id="anio" placeholder="Ej: 2023">
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de vehículo:</label>
                    <select id="tipo">
                        <option value="">-- Selecciona --</option>
                        <option value="Coche">Coche</option>
                        <option value="Moto">Moto</option>
                    </select>
                </div>

                <!-- Campos específicos que aparecen según el tipo -->
                <div id="campos-coche" class="campos-especificos oculto">
                    <div class="form-group">
                        <label for="puertas">Número de puertas:</label>
                        <input type="number" id="puertas" placeholder="Ej: 4">
                    </div>
                </div>

                <div id="campos-moto" class="campos-especificos oculto">
                    <div class="form-group">
                        <label for="cilindrada">Cilindrada (cc):</label>
                        <input type="number" id="cilindrada" placeholder="Ej: 600">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Añadir Vehículo</button>
            </form>
        </div>

        <!-- LISTA DE VEHÍCULOS -->
        <div class="lista-seccion">
            <h2>Inventario de Vehículos</h2>
            <div id="lista-vehiculos">
                <!-- Aquí se mostrarán los vehículos -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
