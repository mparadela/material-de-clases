<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Empleados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏢 Sistema de Gestión de Empleados</h1>
        
        <!-- FORMULARIO PARA AÑADIR EMPLEADO -->
        <div class="formulario-seccion">
            <h2>Añadir Nuevo Empleado</h2>
            <form id="formulario-empleado">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Ana García">
                    <span class="error" id="nombre-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" placeholder="Ej: ana@empresa.com">
                    <span class="error" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="salario">Salario (€):</label>
                    <input type="number" id="salario" placeholder="Ej: 2500">
                    <span class="error" id="salario-error"></span>
                </div>

                <div class="form-group">
                    <label for="departamento">Departamento:</label>
                    <select id="departamento">
                        <option value="">-- Selecciona --</option>
                        <option value="IT">IT</option>
                        <option value="RRHH">RRHH</option>
                        <option value="Ventas">Ventas</option>
                    </select>
                    <span class="error" id="departamento-error"></span>
                </div>

                <button type="submit" class="btn-primary">Añadir Empleado</button>
            </form>
        </div>

        <!-- LISTA DE EMPLEADOS -->
        <div class="lista-seccion">
            <h2>Lista de Empleados</h2>
            <div id="lista-empleados">
                <!-- Aquí se mostrarán los empleados dinámicamente -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
